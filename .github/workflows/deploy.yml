name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar e publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar arquivos da aplicação
        run: |
          test -f index.html
          test -f styles/main.css
          test -f styles/menu.css
          test -f src/main.js
          test -f src/core/Game.js
          test -f src/core/Camera.js
          test -f src/core/Player.js
          test -f src/core/GameLoop.js
          test -f src/core/Input.js
          test -f src/core/Renderer.js
          test -f src/ui/ScreenManager.js
          test -f src/ui/StartupScreen.js
          test -f src/ui/MainMenu.js
          test -f src/ui/ParallaxBackground.js

      - name: Validar sintaxe dos módulos JavaScript
        run: |
          for file in $(find src -name '*.js' -type f); do
            node --input-type=module --check < "$file"
          done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
